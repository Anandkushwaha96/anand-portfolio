<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Resume - Anand Kumar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
        }
        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .back-btn {
            background: #e0e0e0;
            color: #666;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .back-btn:hover {
            background: #d0d0d0;
        }
        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📄 Resume Download</h1>
        <p>Click the button below to download my resume</p>
        
        <!-- This will work on ALL devices -->
        <a href="Anand23.pdf" class="download-btn" id="downloadLink">
            📥 Download Resume (PDF)
        </a>
        
        <br>
        <a href="/" class="back-btn">← Back to Portfolio</a>
        
        <div id="message" class="message"></div>
        <div id="info" class="message info" style="margin-top: 15px;">
            💡 If download doesn't start automatically, right-click the button and select "Save link as..."
        </div>
    </div>

    <script>
        const downloadLink = document.getElementById('downloadLink');
        const messageDiv = document.getElementById('message');
        
        downloadLink.addEventListener('click', function(e) {
            // Show success message
            messageDiv.className = 'message success';
            messageDiv.style.display = 'block';
            messageDiv.innerHTML = '✅ Download started! Check your downloads folder.';
            
            // Hide message after 3 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
